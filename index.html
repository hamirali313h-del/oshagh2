<div class="container">

  <div class="section-header">

    <div class="small">
      02 / بازی
    </div>

    <h2>
      رمی جقرات
    </h2>

    <p>
      سنگ را بکش، نشانه بگیر و اسم‌ها را هدف بگیر.
    </p>

  </div>


  <div class="game-wrapper">

    <div id="gameArea">

      <div
        class="game-board"
        id="gameBoard"
      >

        <!-- امتیاز -->

        <div class="game-score">
          امتیاز:
          <strong id="gameScore">0</strong>
        </div>


        <!-- دیوار هدف -->

        <div class="target-wall">

          <div
            class="target"
            data-name="فتوحا"
          >
            <span>فتوحا</span>
          </div>

          <div
            class="target"
            data-name="حسام"
          >
            <span>حسام</span>
          </div>

          <div
            class="target"
            data-name="فریم"
          >
            <span>فریم</span>
          </div>

          <div
            class="target"
            data-name="جوربا"
          >
            <span>جوربا</span>
          </div>

        </div>


        <!-- تیرکمان -->

        <div
          class="slingshot"
          id="slingshot"
        >

          <div class="slingshot-arm left"></div>

          <div class="slingshot-arm right"></div>

          <div
            class="slingshot-band"
            id="slingBand"
          ></div>

          <div class="slingshot-base"></div>

        </div>


        <!-- سنگ -->

        <div
          id="gameProjectile"
          title="سنگ را بکش و پرتاب کن"
        >
          <span></span>
        </div>


        <!-- پیام بازی -->

        <div
          id="gameMessage"
          class="game-message"
        >
          سنگ را بکش و رها کن
        </div>

      </div>

    </div>


    <button
      id="playGameBtn"
      class="btn primary"
      style="
        display:block;
        margin:20px auto 0;
      "
    >
      شروع بازی
    </button>

  </div>

</div>
