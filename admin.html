<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | عشاق</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-page {
      min-height: 100vh;
      padding: 70px 0;
    }

    .admin-box {
      max-width: 850px;
      margin: auto;
      background: rgba(255,255,255,.9);
      border: 1px solid #d8e5ee;
      border-radius: 28px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(31,78,112,.12);
    }

    .admin-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .admin-header .icon {
      width: 75px;
      height: 75px;
      margin: auto auto 15px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #e5f2f9;
      color: #3185bd;
      font-size: 30px;
    }

    .admin-header h1 {
      font-size: 27px;
      color: #193d58;
    }

    .admin-header p {
      margin-top: 5px;
      font-size: 10px;
      color: #7c919f;
    }

    .admin-login {
      max-width: 400px;
      margin: auto;
    }

    .admin-login input,
    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      width: 100%;
      border: 1px solid #d6e3eb;
      background: #f9fcfe;
      border-radius: 13px;
      padding: 13px 15px;
      outline: none;
      font-size: 11px;
      margin-bottom: 12px;
    }

    .admin-login input:focus,
    .admin-form input:focus,
    .admin-form textarea:focus,
    .admin-form select:focus {
      border-color: #62a6d2;
    }

    .admin-login .btn {
      width: 100%;
    }

    .admin-error {
      min-height: 20px;
      margin-top: 8px;
      color: #d65763;
      font-size: 9px;
      text-align: center;
    }

    .dashboard {
      display: none;
    }

    .dashboard.show {
      display: block;
    }

    .dashboard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 25px;
      margin-bottom: 25px;
      border-bottom: 1px solid #e0e9ef;
    }

    .dashboard-top h2 {
      font-size: 21px;
      color: #244a63;
    }

    .dashboard-top p {
      font-size: 9px;
      color: #8094a2;
    }

    .logout-btn {
      border: 1px solid #d3e1e9;
      background: #f5f9fb;
      color: #667e8e;
      padding: 8px 13px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 9px;
    }

    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .admin-tab {
      border: 1px solid #d5e3eb;
      background: #f7fbfd;
      color: #60798b;
      padding: 9px 17px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 10px;
    }

    .admin-tab.active {
      background: #3688be;
      border-color: #3688be;
      color: white;
    }

    .admin-panel {
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-form label {
      display: block;
      color: #486a7e;
      font-size: 10px;
      margin-bottom: 6px;
    }

    .admin-form textarea {
      min-height: 150px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .admin-status {
      min-height: 25px;
      margin-top: 10px;
      text-align: center;
      font-size: 9px;
    }

    .back-home {
      display: block;
      width: fit-content;
      margin: 25px auto 0;
      color: #658092;
      font-size: 9px;
    }

    @media(max-width:650px) {
      .admin-page {
        padding: 30px 0;
      }

      .admin-box {
        padding: 22px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .dashboard-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-tabs {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<div class="watermarks">
  <span>یاریکون</span>
  <span>ادرکنی</span>
  <span>جوقاد</span>
  <span>26 85</span>
  <span>عشاق</span>
  <span>یاریکون</span>
  <span>جوقاد</span>
  <span>26 85</span>
</div>


<main class="admin-page">

  <div class="container">

    <div class="admin-box">

      <!-- LOGIN -->

      <div id="adminLogin">

        <div class="admin-header">

          <div class="icon">
            ⚿
          </div>

          <h1>ورود به پنل مدیریت</h1>

          <p>
            این بخش فقط برای مدیر سایت است
          </p>

        </div>


        <div class="admin-login">

          <input
            id="adminPassword"
            type="password"
            placeholder="رمز مدیریت"
            autocomplete="off"
          >

          <button
            id="adminLoginButton"
            class="btn primary"
          >
            ورود به پنل
          </button>

          <div
            id="adminLoginError"
            class="admin-error"
          ></div>

        </div>

      </div>


      <!-- DASHBOARD -->

      <div
        id="dashboard"
        class="dashboard"
      >

        <div class="dashboard-top">

          <div>

            <h2>
              پنل مدیریت عشاق
            </h2>

            <p>
              مدیریت مطالب و موزیک‌های سایت
            </p>

          </div>

          <button
            id="logoutButton"
            class="logout-btn"
          >
            خروج
          </button>

        </div>


        <!-- TABS -->

        <div class="admin-tabs">

          <button
            class="admin-tab active"
            data-panel="postPanel"
          >
            افزودن مطلب
          </button>

          <button
            class="admin-tab"
            data-panel="musicPanel"
          >
            افزودن موزیک
          </button>

        </div>


        <!-- POST -->

        <section
          id="postPanel"
          class="admin-panel active"
        >

          <form
            id="postForm"
            class="admin-form"
          >

            <div class="form-row">

              <div>

                <label>
                  عنوان مطلب
                </label>

                <input
                  id="postTitle"
                  type="text"
                  placeholder="عنوان مطلب"
                  required
                >

              </div>


              <div>

                <label>
                  تصویر مطلب
                </label>

                <input
                  id="postImage"
                  type="url"
                  placeholder="آدرس تصویر"
                >

              </div>

            </div>


            <label>
              متن مطلب
            </label>

            <textarea
              id="postContent"
              placeholder="متن مطلب را بنویسید..."
              required
            ></textarea>


            <button
              type="submit"
              class="btn primary"
            >
              انتشار مطلب
            </button>


            <div
              id="postStatus"
              class="admin-status"
            ></div>

          </form>

        </section>


        <!-- MUSIC -->

        <section
          id="musicPanel"
          class="admin-panel"
        >

          <form
            id="musicForm"
            class="admin-form"
          >

            <div class="form-row">

              <div>

                <label>
                  نام موزیک
                </label>

                <input
                  id="musicTitle"
                  type="text"
                  placeholder="نام آهنگ"
                  required
                >

              </div>


              <div>

                <label>
                  نام خواننده
                </label>

                <input
                  id="musicArtist"
                  type="text"
                  placeholder="نام خواننده"
                >

              </div>

            </div>


            <label>
              آدرس فایل موزیک
            </label>

            <input
              id="musicUrl"
              type="url"
              placeholder="https://..."
              required
            >


            <label>
              آدرس کاور
            </label>

            <input
              id="musicCover"
              type="url"
              placeholder="https://..."
            >


            <button
              type="submit"
              class="btn primary"
            >
              انتشار موزیک
            </button>


            <div
              id="musicStatus"
              class="admin-status"
            ></div>

          </form>

        </section>

      </div>


      <a
        href="index.html"
        class="back-home"
      >
        ← بازگشت به سایت
      </a>

    </div>

  </div>

</main>


<script>

  /* ============================================
     ADMIN LOGIN
  ============================================ */

  const ADMIN_PASSWORD = "rikon269";

  const loginBox =
    document.getElementById("adminLogin");

  const dashboard =
    document.getElementById("dashboard");

  const passwordInput =
    document.getElementById("adminPassword");

  const loginButton =
    document.getElementById("adminLoginButton");

  const loginError =
    document.getElementById("adminLoginError");

  const logoutButton =
    document.getElementById("logoutButton");


  function showDashboard() {

    loginBox.style.display = "none";

    dashboard.classList.add("show");

  }


  function showLogin() {

    loginBox.style.display = "block";

    dashboard.classList.remove("show");

  }


  loginButton.addEventListener(
    "click",
    () => {

      const password =
        passwordInput.value.trim();


      if (password === ADMIN_PASSWORD) {

        sessionStorage.setItem(
          "oshaghAdmin",
          "true"
        );

        showDashboard();

      } else {

        loginError.textContent =
          "رمز مدیریت اشتباه است.";

      }

    }
  );


  passwordInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        loginButton.click();
      }

    }
  );


  logoutButton.addEventListener(
    "click",
    () => {

      sessionStorage.removeItem(
        "oshaghAdmin"
      );

      showLogin();

    }
  );


  if (
    sessionStorage.getItem("oshaghAdmin")
    === "true"
  ) {

    showDashboard();

  }


  /* ============================================
     ADMIN TABS
  ============================================ */

  const adminTabs =
    document.querySelectorAll(".admin-tab");

  const adminPanels =
    document.querySelectorAll(".admin-panel");


  adminTabs.forEach(tab => {

    tab.addEventListener(
      "click",
      () => {

        adminTabs.forEach(item =>
          item.classList.remove("active")
        );

        adminPanels.forEach(panel =>
          panel.classList.remove("active")
        );


        tab.classList.add("active");


        const panel =
          document.getElementById(
            tab.dataset.panel
          );


        if (panel) {
          panel.classList.add("active");
        }

      }
    );

  });


  /* ============================================
     TEMPORARY POST FORM
  ============================================ */

  document
    .getElementById("postForm")
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const status =
          document.getElementById("postStatus");


        status.textContent =
          "مطلب آماده انتشار است.";


        status.style.color =
          "#3688be";

      }
    );


  /* ============================================
     TEMPORARY MUSIC FORM
  ============================================ */

  document
    .getElementById("musicForm")
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const status =
          document.getElementById("musicStatus");


        status.textContent =
          "موزیک آماده انتشار است.";


        status.style.color =
          "#3688be";

      }
    );

</script>

</body>
</html>
