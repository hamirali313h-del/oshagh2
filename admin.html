<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | عشاق</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 80% 10%,rgba(40,140,220,.12),transparent 30%),
        #f4f9fd;
    }

    .admin-page{
      padding:70px 0 100px;
    }

    .admin-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:35px;
    }

    .admin-title{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .admin-logo{
      width:58px;
      height:58px;
      object-fit:contain;
      background:white;
      border-radius:16px;
      padding:7px;
      box-shadow:0 8px 25px rgba(30,100,160,.1);
    }

    .admin-title h1{
      font-size:27px;
      margin:0 0 5px;
    }

    .admin-title p{
      color:#71889a;
      font-size:11px;
      margin:0;
    }

    .logout-btn{
      padding:10px 17px;
      border-radius:12px;
      background:#fff;
      border:1px solid #d7e5ef;
      color:#667d8e;
      font-family:inherit;
      cursor:pointer;
    }

    .admin-card{
      background:#fff;
      border:1px solid #dce8f2;
      border-radius:24px;
      padding:28px;
      margin-bottom:22px;
      box-shadow:0 10px 35px rgba(25,85,135,.06);
    }

    .admin-card h2{
      font-size:19px;
      margin-bottom:20px;
    }

    .admin-form{
      display:grid;
      gap:15px;
    }

    .admin-form label{
      font-size:11px;
      font-weight:600;
      color:#526b7d;
    }

    .admin-form input,
    .admin-form textarea,
    .admin-form select{
      width:100%;
      margin-top:7px;
      padding:12px 14px;
      border:1px solid #d8e5ee;
      border-radius:12px;
      background:#fafdff;
      color:#18324a;
      font-family:inherit;
      outline:none;
    }

    .admin-form textarea{
      min-height:130px;
      resize:vertical;
      line-height:2;
    }

    .admin-form input:focus,
    .admin-form textarea:focus,
    .admin-form select:focus{
      border-color:#68a9dc;
      box-shadow:0 0 0 4px rgba(25,118,210,.07);
    }

    .file-box{
      padding:18px;
      border:1px dashed #b9d2e5;
      border-radius:15px;
      background:#f8fbfd;
    }

    .file-box input{
      margin-top:10px;
      border:0;
      padding:0;
      background:transparent;
    }

    .form-message{
      min-height:22px;
      font-size:11px;
    }

    .form-message.success{
      color:#168654;
    }

    .form-message.error{
      color:#d24f5c;
    }

    .admin-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
    }

    .admin-note{
      color:#71889a;
      font-size:10px;
      line-height:2;
      margin-top:15px;
    }

    @media(max-width:700px){

      .admin-page{
        padding:45px 0;
      }

      .admin-header{
        align-items:flex-start;
      }

      .admin-grid{
        grid-template-columns:1fr;
      }

      .admin-card{
        padding:20px;
      }

      .admin-title h1{
        font-size:22px;
      }

      .logout-btn{
        font-size:10px;
      }
    }
  </style>
</head>

<body>

  <main class="admin-page">

    <div class="container">

      <header class="admin-header">

        <div class="admin-title">

          <img
            src="logo.png"
            class="admin-logo"
            alt="عشاق"
          >

          <div>
            <h1>پنل مدیریت</h1>
            <p>مدیریت مطالب و موزیک عشاق</p>
          </div>

        </div>

        <button
          id="logoutBtn"
          class="logout-btn"
          type="button"
        >
          خروج
        </button>

      </header>


      <!-- وضعیت ورود -->

      <div
        id="authMessage"
        class="admin-card"
      >
        در حال بررسی دسترسی...
      </div>


      <!-- فرم‌ها -->

      <div
        id="adminContent"
        style="display:none;"
      >

        <div class="admin-grid">


          <!-- =====================
               POST
          ====================== -->

          <section class="admin-card">

            <h2>
              افزودن مطلب
            </h2>

            <form
              id="postForm"
              class="admin-form"
            >

              <label>
                عنوان مطلب

                <input
                  id="postTitle"
                  type="text"
                  maxlength="200"
                  placeholder="عنوان مطلب"
                  required
                >

              </label>


              <label>
                متن مطلب

                <textarea
                  id="postContent"
                  placeholder="متن مطلب..."
                ></textarea>

              </label>


              <label>
                نوع فایل

                <select id="postMediaType">

                  <option value="image">
                    تصویر
                  </option>

                  <option value="video">
                    ویدیو
                  </option>

                </select>

              </label>


              <div class="file-box">

                <label>
                  فایل تصویر / ویدیو

                  <input
                    id="postFile"
                    type="file"
                    accept="image/*,video/*"
                  >

                </label>

              </div>


              <button
                class="btn primary"
                type="submit"
              >
                انتشار مطلب
              </button>


              <div
                id="postMessage"
                class="form-message"
              ></div>

            </form>

          </section>


          <!-- =====================
               MUSIC
          ====================== -->

          <section class="admin-card">

            <h2>
              افزودن موزیک
            </h2>

            <form
              id="musicForm"
              class="admin-form"
            >

              <label>
                نام آهنگ

                <input
                  id="musicTitle"
                  type="text"
                  maxlength="200"
                  placeholder="نام آهنگ"
                  required
                >

              </label>


              <label>
                خواننده / سازنده

                <input
                  id="musicArtist"
                  type="text"
                  maxlength="150"
                  placeholder="عشاق"
                >

              </label>


              <div class="file-box">

                <label>
                  فایل آهنگ

                  <input
                    id="musicFile"
                    type="file"
                    accept="audio/*"
                    required
                  >

                </label>

              </div>


              <div class="file-box">

                <label>
                  کاور آهنگ

                  <input
                    id="musicCover"
                    type="file"
                    accept="image/*"
                  >

                </label>

              </div>


              <button
                class="btn primary"
                type="submit"
              >
                افزودن آهنگ
              </button>


              <div
                id="musicMessage"
                class="form-message"
              ></div>

            </form>

          </section>

        </div>


        <div class="admin-card">

          <h2>
            راهنما
          </h2>

          <p class="admin-note">
            از همین پنل می‌توانی مطالب، تصاویر، ویدیوها و آهنگ‌ها را
            اضافه کنی. فایل‌ها مستقیماً در فضای ذخیره‌سازی سایت قرار
            می‌گیرند و اطلاعات آن‌ها در دیتابیس ثبت می‌شود.
          </p>

        </div>

      </div>

    </div>

  </main>


  <script>

    /*
      اتصال Supabase در مرحله بعد
      به این فایل اضافه خواهد شد.
    */

    const authMessage =
      document.getElementById("authMessage");

    const adminContent =
      document.getElementById("adminContent");


    /*
      فعلاً فقط ظاهر پنل ساخته شده.
      بعد از اتصال Supabase،
      این قسمت دسترسی واقعی مدیر را بررسی می‌کند.
    */

    authMessage.innerHTML = `
      <strong>پنل مدیریت آماده است.</strong>
      <p class="admin-note">
        اتصال امن به Supabase در مرحله بعد فعال می‌شود.
      </p>
    `;

    adminContent.style.display = "block";


    document
      .getElementById("logoutBtn")
      .addEventListener("click", () => {

        window.location.href = "index.html";

      });

  </script>

</body>
</html>
